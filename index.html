html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}

select,button{font:inherit}
select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}

.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

input.ok{border-color:var(--ok);background:var(--okbg)}
input.ko{border-color:var(--ko);background:var(--kobg)}

</style>

[7,"¿Qué permite chmod 755 script.sh?","Que todos lo ejecuten y solo el propietario lo modifique",["Que solo el propietario lo ejecute","Que todos lo modifiquen","Que nadie lo lea"],"rwxr-xr-x."],
[7,"¿Por qué se usa sudo para crear /srv/proyecto-web?","Porque crear en /srv requiere privilegios de administrador",["Porque es obligatorio en todos los directorios","Porque sudo da más memoria","Porque evita los permisos"],"Un usuario normal no puede escribir ahí."],
[7,"¿Para qué sirve el grupo equipo-web en el reto final?","Para dar acceso compartido a anaweb y jonweb",["Para dar acceso a todos los usuarios","Para impedir que anaweb escriba","Para cambiar contraseñas"],"Propietario y grupo acceden; otros no."]
].map(([t,q,c,w,e])=>({t,q,c,w,e}));

const $=s=>document.querySelector(s), app=$("#app");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let sel=new Set(T.map((_,i)=>i)), count=10, pool=[], i=0, score=0, wrong=[], byT={};

function home(){
  app.innerHTML=`<div class="card"><b>Temas</b>
  <div class="chips">${T.map((n,k)=>`<span class="chip ${sel.has(k)?"on":""}" data-k="${k}">${n}</span>`).join("")}</div>
  <div class="row"><label>Preguntas:
  <select id="n">${[10,20,40,RAW.length].map(v=>`<option value="${v}" ${v==count?"selected":""}>${v==RAW.length?"Todas ("+v+")":v}</option>`).join("")}</select></label>
  <button class="btn" id="go">Empezar</button></div></div>
  <p class="sub">${RAW.length} preguntas disponibles. El orden de preguntas y respuestas es aleatorio.</p>
  <div class="card cv"><b>Conversión de bases</b><p class="sub" style="margin:6px 0 12px">Te damos un número en binario, decimal o hexadecimal y tienes que pasarlo a las otras dos bases.</p><button class="btn" id="cv">Practicar conversiones</button></div>`;
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const k=+c.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);home()});
  $("#n").onchange=e=>count=+e.target.value;
  $("#go").disabled=!sel.size;
  $("#go").onclick=start;$("#cv").onclick=convHome;
}
function start(){
  pool=shuffle(RAW.filter(q=>sel.has(q.t))).slice(0,count);
  i=0;score=0;wrong=[];byT={};show();
}
function show(){
  const q=pool[i], opts=shuffle([q.c,...q.w]);
  app.innerHTML=`<div class="card"><div class="meta"><span>Pregunta ${i+1} de ${pool.length}</span><span>${T[q.t]}</span></div>
  <div class="bar"><i style="width:${i/pool.length*100}%"></i></div>
  <div class="q">${q.q}</div>
  ${opts.map(o=>`<button class="opt">${o}</button>`).join("")}
  <div id="fb"></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
}
function answer(b,q){
  const ok=b.textContent===q.c, s=byT[q.t]=byT[q.t]||[0,0];
  s[1]++; if(ok){score++;s[0]++}else wrong.push(q);
  document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.textContent===q.c)o.classList.add("ok");else if(o===b)o.classList.add("ko")});
  const last=i==pool.length-1;
  $("#fb").innerHTML=`<div class="exp"><b>${ok?"¡Correcto!":"Incorrecto."}</b> ${q.e}</div>
  <button class="btn" id="nx">${last?"Ver resultado":"Siguiente"}</button>`;
  $("#nx").onclick=()=>{i++;last?end():show()};
}
function end(){
  const p=Math.round(score/pool.length*100);
  app.innerHTML=`<div class="card"><p class="big ${p>=50?"good":""}">${score}/${pool.length}</p>
  <p>${p}% de aciertos · ${p>=90?"¡Excelente!":p>=70?"Muy bien.":p>=50?"Aprobado, pero repasa los fallos.":"Toca repasar los apuntes."}</p>
  ${Object.keys(byT).map(k=>`<div class="tb"><span>${T[k]}</span><b>${byT[k][0]}/${byT[k][1]}</b></div>`).join("")}</div>
  ${wrong.length?`<div class="card"><b>Para repasar</b>${wrong.map(q=>`<div class="rev">${q.q}<b class="good">${q.c}</b><small>${q.e}</small></div>`).join("")}</div>`:""}
  <div class="row"><button class="btn" id="re">Repetir</button><button class="btn sec" id="hm">Cambiar temas</button></div>`;
  $("#re").onclick=start;$("#hm").onclick=home;
}
const BN={2:"binario",10:"decimal",16:"hexadecimal"};
let cv={max:255,n:10,i:0,s:0,cur:null};
const rnd=n=>Math.floor(Math.random()*(n+1));
const fm=(v,b)=>{let s=v.toString(b).toUpperCase();if(b==2){while(s.length%4)s="0"+s;s=s.match(/.{1,4}/g).join(" ")}return s};
function convHome(){
  app.innerHTML=`<div class="card"><b>Conversión de bases</b><p class="sub">Pasa el número a las otras dos bases. Puedes escribir el binario con o sin espacios.</p>
  <div class="row"><label>Nivel: <select id="lv"><option value="15">Fácil (0–15)</option><option value="255" selected>Medio (0–255)</option><option value="65535">Difícil (0–65535)</option></select></label>
  <label>Ejercicios: <select id="cn"><option>10</option><option>20</option><option>30</option></select></label></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="cs">Empezar</button><button class="btn sec" id="cb">Volver</button></div></div>
  <div class="card"><b>Chuleta</b><p class="sub" style="margin:6px 0 0">Hex: A=10, B=11, C=12, D=13, E=14, F=15. Pesos binarios: 128, 64, 32, 16, 8, 4, 2, 1. Cada dígito hexadecimal equivale a 4 bits.</p></div>`;
  $("#cb").onclick=home;
  $("#cs").onclick=()=>{cv={max:+$("#lv").value,n:+$("#cn").value,i:0,s:0,cur:null};convNext()};
}
function convNext(){
  const v=1+rnd(cv.max-1), b=[2,10,16][rnd(2)], tg=[2,10,16].filter(x=>x!=b);
  cv.cur={v,b,tg};
  app.innerHTML=`<div class="card"><div class="meta"><span>Ejercicio ${cv.i+1} de ${cv.n}</span><span>Aciertos: ${cv.s}</span></div>
  <div class="bar"><i style="width:${cv.i/cv.n*100}%"></i></div>
  <div class="q">${fm(v,b)} <small style="color:var(--muted)">(${BN[b]})</small></div>
  ${tg.map((x,k)=>`<p style="margin:10px 0 4px">Pásalo a ${BN[x]}:</p><input id="t${k}" autocomplete="off" autocapitalize="off" spellcheck="false">`).join("")}
  <div id="fb" style="margin-top:14px"><button class="btn" id="ck">Comprobar</button></div></div>`;
  $("#t0").focus();
  $("#ck").onclick=convCheck;
  app.onkeydown=e=>{if(e.key=="Enter"&&e.target.tagName=="INPUT"&&$("#ck"))$("#ck").click()};
}
function convCheck(){
  const c=cv.cur;let all=true;
  c.tg.forEach((x,k)=>{
    const el=$("#t"+k), t=el.value.toLowerCase().replace(/\s/g,"").replace(/^0[xb]/,"");
    const re={2:/^[01]+$/,10:/^\d+$/,16:/^[0-9a-f]+$/}[x];
    const ok=re.test(t)&&parseInt(t,x)===c.v;
    el.classList.add(ok?"ok":"ko");el.disabled=true;if(!ok)all=false;
  });
  if(all)cv.s++;
  cv.i++;const last=cv.i==cv.n;
  $("#fb").innerHTML=`<div class="exp"><b>${all?"¡Correcto!":"Revisa:"}</b> ${fm(c.v,2)} (bin) = ${c.v} (dec) = ${c.v.toString(16).toUpperCase()} (hex)</div><button class="btn" id="nx">${last?"Ver resultado":"Siguiente"}</button>`;
  $("#nx").onclick=()=>last?convEnd():convNext();
  $("#nx").focus();
}
function convEnd(){
  const p=Math.round(cv.s/cv.n*100);
  app.innerHTML=`<div class="card"><p class="big ${p>=50?"good":""}">${cv.s}/${cv.n}</p><p>${p}% de aciertos · ${p>=90?"¡Dominas las conversiones!":p>=60?"Bien, sigue practicando.":"Repasa los pesos binarios y la tabla hexadecimal."}</p></div>
  <div class="row"><button class="btn" id="re">Repetir</button><button class="btn sec" id="hm">Volver al inicio</button></div>`;
  $("#re").onclick=()=>{cv.i=0;cv.s=0;convNext()};$("#hm").onclick=home;
}
home();
</script>
</body>
</html>
